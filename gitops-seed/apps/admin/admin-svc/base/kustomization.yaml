apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: admin
labels:
  - pairs:
      app.kubernetes.io/name: admin-svc
      app.kubernetes.io/part-of: marketplace
      marketplace/group: admin
    includeSelectors: false
resources:
  - serviceaccount.yaml
  - deployment.yaml
