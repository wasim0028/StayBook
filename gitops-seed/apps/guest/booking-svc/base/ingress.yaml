apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: booking-svc
  annotations:
    alb.ingress.kubernetes.io/group.name: marketplace-api
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /healthz/ready
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=20
    # Set per overlay: alb.ingress.kubernetes.io/certificate-arn
spec:
  ingressClassName: alb
  rules:
    - host: api.example.in # patched per overlay
      http:
        paths:
          - path: /v1/bookings
            pathType: Prefix
            backend:
              service: { name: booking-svc, port: { name: http } }
          - path: /v1/trips
            pathType: Prefix
            backend:
              service: { name: booking-svc, port: { name: http } }
          - path: /v1/host/reservations
            pathType: Prefix
            backend:
              service: { name: booking-svc, port: { name: http } }
          - path: /v1/admin/bookings
            pathType: Prefix
            backend:
              service: { name: booking-svc, port: { name: http } }
          - path: /v1/quote
            pathType: Exact
            backend:
              service: { name: booking-svc, port: { name: http } }
